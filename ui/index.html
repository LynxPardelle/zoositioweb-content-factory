<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zoositioweb Content Factory</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="rail" aria-label="Navegacion principal">
        <div class="brand">
          <div class="brand-mark">Z</div>
          <div>
            <strong>Zoositioweb</strong>
            <span>Content Factory</span>
          </div>
        </div>
        <nav class="nav" id="sideNav"></nav>
        <div class="rail-footer">
          <span class="status-dot"></span>
          <span id="validationStatus">Validando datos</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1>Zoositioweb Content Factory</h1>
            <p id="pilotMeta">Cargando piloto</p>
          </div>
          <div class="top-actions">
            <label class="search">
              <span>Buscar</span>
              <input id="searchInput" type="search" placeholder="Script, sector, hook o CTA">
            </label>
            <button class="icon-button" id="refreshButton" type="button" aria-label="Recargar datos" title="Recargar datos">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v6h-6"/></svg>
            </button>
          </div>
        </header>

        <section class="metric-strip" id="metrics"></section>

        <section class="filters">
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="filter-group">
            <label>
              Sector
              <select id="sectorFilter"></select>
            </label>
            <label>
              Estado
              <select id="statusFilter">
                <option value="all">Todos</option>
                <option value="draft">Draft</option>
                <option value="needs-review">Needs review</option>
                <option value="approved">Approved</option>
                <option value="published">Published</option>
              </select>
            </label>
          </div>
        </section>

        <section class="content-grid">
          <div class="primary-panel" id="primaryPanel"></div>
          <aside class="detail-panel" id="detailPanel" aria-live="polite"></aside>
        </section>
      </main>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
